<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Calendar icon -->
  <rect x="60" y="70" width="136" height="116" rx="12" fill="white" opacity="0.95"/>
  
  <!-- Calendar header -->
  <rect x="60" y="70" width="136" height="32" rx="12" fill="white"/>
  <rect x="60" y="90" width="136" height="12" fill="#667eea"/>
  
  <!-- Calendar rings -->
  <rect x="90" y="62" width="8" height="24" rx="4" fill="#4a5568"/>
  <rect x="158" y="62" width="8" height="24" rx="4" fill="#4a5568"/>
  
  <!-- Calendar grid -->
  <g fill="#667eea" opacity="0.7">
    <rect x="75" y="115" width="20" height="20" rx="4"/>
    <rect x="105" y="115" width="20" height="20" rx="4"/>
    <rect x="135" y="115" width="20" height="20" rx="4"/>
    <rect x="165" y="115" width="20" height="20" rx="4"/>
    
    <rect x="75" y="145" width="20" height="20" rx="4"/>
    <rect x="105" y="145" width="20" height="20" rx="4"/>
  </g>
  
  <!-- Active day highlight -->
  <rect x="135" y="145" width="20" height="20" rx="4" fill="#764ba2"/>
  <rect x="165" y="145" width="20" height="20" rx="4" fill="#667eea" opacity="0.7"/>
  
  <!-- Checkmark accent -->
  <circle cx="190" cy="180" r="28" fill="#48bb78"/>
  <path d="M175 180 L185 190 L205 170" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
